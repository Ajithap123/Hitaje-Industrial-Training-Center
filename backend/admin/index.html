<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HITAJE Admin</title><style>
:root{font-family:system-ui,sans-serif;color:#172b46;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:900px;margin:auto;padding:24px}.card{background:white;border:1px solid #dce5f1;border-radius:16px;padding:18px;margin:14px 0}h1{margin:0 0 8px}input,textarea,select,button{font:inherit;padding:10px;border:1px solid #ccd8e8;border-radius:9px;width:100%;margin:5px 0}button{background:#17365d;color:white;border:0;font-weight:700;cursor:pointer}.secondary{background:#e7eef9;color:#17365d}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{padding:12px;border:1px solid #e0e7f0;border-radius:10px;margin:8px 0;overflow-wrap:anywhere}.item button{width:auto;padding:7px 12px;margin-right:5px}.muted{color:#61738b;font-size:13px}#status{white-space:pre-wrap;color:#b42318}@media(max-width:600px){.row{grid-template-columns:1fr}.wrap{padding:14px}}</style></head><body><main class="wrap"><h1>HITAJE GROUPS · Admin</h1><p class="muted">Manage announcements, resources and contact enquiries.</p><div id="status"></div><section class="card" id="loginCard"><h2>Admin login</h2><input id="username" autocomplete="username" placeholder="Username"><input id="password" type="password" autocomplete="current-password" placeholder="Password"><button id="login">Sign in</button></section><div id="panel" hidden><section class="card"><h2>Create announcement / resource</h2><select id="type"><option value="announcements">Announcement</option><option value="resources">Resource</option></select><input id="title" placeholder="Title" maxlength="180"><textarea id="body" placeholder="Message / description" rows="4" maxlength="5000"></textarea><div class="row"><input id="category" placeholder="Category (e.g. resources, videos)"><input id="url" type="url" placeholder="Optional HTTPS URL"></div><label><input id="published" type="checkbox" checked style="width:auto"> Published</label><button id="create">Publish</button></section><section class="card"><h2>Announcements</h2><div id="announcements"></div></section><section class="card"><h2>Resources</h2><div id="resources"></div></section><section class="card"><h2>Contact enquiries / Form responses</h2><p class="muted">Export all submitted responses as a CSV that opens in Excel or Google Sheets.</p><button id="exportContacts" class="secondary">Export responses to CSV</button><div id="contacts"></div></section><button class="secondary" id="logout">Sign out</button></div></main><script>
let token='';const $=id=>document.getElementById(id);function status(s){$('status').textContent=s}async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opt.headers||{})}});if(r.status===204)return null;let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'HTTP '+r.status);return d}function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('login').onclick=async()=>{try{const d=await api('/api/admin/login',{method:'POST',body:JSON.stringify({username:$('username').value,password:$('password').value})});token=d.token;$('loginCard').hidden=true;$('panel').hidden=false;status('');await refresh()}catch(e){status(e.message)}};
async function downloadContactsCsv(){try{const r=await fetch('/api/admin/contacts.csv',{headers:{Authorization:'Bearer '+token}});if(!r.ok){let d={};try{d=await r.json()}catch{}throw Error(d.error||'Could not export responses (HTTP '+r.status+')')}const blob=await r.blob();const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='hitaje-form-responses.csv';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);status('CSV export downloaded.')}catch(e){status(e.message)}}
$('exportContacts').onclick=downloadContactsCsv;
async function refresh(){try{for(const type of ['announcements','resources']){const arr=await api('/api/admin/'+type);$(type).innerHTML=arr.map(x=>`<div class="item"><b>${safe(x.title)}</b> · ${x.published?'published':'draft'}<p>${safe(x.body)}</p><button class="secondary" onclick="togglePub('${type}','${x.id}',${!x.published})">${x.published?'Unpublish':'Publish'}</button><button onclick="removeItem('${type}','${x.id}')">Delete</button></div>`).join('')||'<p class="muted">Nothing here yet.</p>'}const contacts=await api('/api/admin/contacts');$('contacts').innerHTML=contacts.map(c=>`<div class="item"><b>${safe(c.name)}</b> · ${safe(c.email)}<p>${safe(c.message)}</p><small>${safe(c.createdAt)}</small></div>`).join('')||'<p class="muted">No enquiries yet.</p>'}catch(e){status(e.message)}}
window.removeItem=async(type,id)=>{if(!confirm('Delete this item?'))return;try{await api('/api/admin/'+type+'/'+id,{method:'DELETE'});await refresh()}catch(e){status(e.message)}};window.togglePub=async(type,id,published)=>{try{const arr=await api('/api/admin/'+type);const x=arr.find(a=>a.id===id);await api('/api/admin/'+type+'/'+id,{method:'PUT',body:JSON.stringify({...x,published})});await refresh()}catch(e){status(e.message)}};
$('create').onclick=async()=>{try{await api('/api/admin/'+$('type').value,{method:'POST',body:JSON.stringify({title:$('title').value,body:$('body').value,category:$('category').value,url:$('url').value,published:$('published').checked})});$('title').value='';$('body').value='';$('url').value='';$('category').value='';status('Saved.');await refresh()}catch(e){status(e.message)}};$('logout').onclick=()=>{token='';$('panel').hidden=true;$('loginCard').hidden=false;status('Signed out.')};
</script></body></html>
