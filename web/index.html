<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#142B4A"><meta name="description" content="HITAJE GROUPS learning and resources hub">
<link rel="manifest" href="manifest.webmanifest"><title>HITAJE GROUPS</title><script src="api-config.js"></script>
<style>
:root{--navy:#142B4A;--blue:#3478F6;--ink:#17263b;--muted:#66758a;--bg:#F8FAFC;--line:#e4eaf2;--white:#fff;--soft:#edf3ff;--shadow:0 8px 24px rgba(20,43,74,.07)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button,a{ -webkit-tap-highlight-color:transparent}button{cursor:pointer}.app{width:100%;max-width:560px;margin:0 auto;min-height:100dvh;padding-bottom:92px;background:var(--bg)}
.topbar{display:flex;align-items:center;gap:12px;padding:calc(17px + env(safe-area-inset-top)) 21px 16px;background:var(--white);border-bottom:1px solid var(--line)}.logo{width:42px;height:42px;border-radius:12px;background:var(--navy);color:white;display:grid;place-items:center;font-weight:850;font-size:21px;letter-spacing:-1px;flex-shrink:0}.brand{min-width:0;flex:1}.brandname{font-size:15px;font-weight:800;letter-spacing:.25px;color:var(--navy)}.brandtag{font-size:11px;color:var(--muted);margin-top:1px}.iconbtn{width:42px;height:42px;border:1px solid var(--line);background:white;color:var(--navy);border-radius:13px;display:grid;place-items:center;position:relative}.iconbtn svg{width:21px;height:21px}.dot{position:absolute;width:7px;height:7px;background:var(--blue);border:1px solid white;border-radius:50%;right:9px;top:8px}
.hero{padding:24px 21px 19px}.eyebrow{font-size:10px;letter-spacing:1.7px;font-weight:800;color:var(--blue);text-transform:uppercase}.hero h1{font-size:29px;line-height:1.15;letter-spacing:-.9px;color:var(--navy);margin:7px 0 7px}.hero p{margin:0;color:var(--muted);font-size:13px;max-width:360px}.searchwrap{padding:0 21px 7px}.search{display:flex;align-items:center;gap:10px;padding:0 14px;height:51px;background:white;border:1px solid #dce4ef;border-radius:13px;box-shadow:0 3px 12px #142b4a08}.search svg{width:19px;height:19px;color:#718198;flex-shrink:0}.search input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font-size:14px}.search input::placeholder{color:#8b98aa}.section{padding:20px 21px 0}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}.sectionhead h2{font-size:17px;letter-spacing:-.3px;color:var(--navy);margin:0}.muted{font-size:11px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{min-width:0;min-height:137px;text-align:left;background:white;border:1px solid var(--line);border-radius:17px;padding:16px 14px;color:var(--ink);box-shadow:0 3px 12px #142b4a05;transition:transform .15s,border-color .15s,box-shadow .15s}.tile:active{transform:scale(.98)}.tile:hover{border-color:#b7cdf8;box-shadow:var(--shadow)}.tileicon{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:var(--soft);color:var(--blue);margin-bottom:13px}.tileicon svg{width:22px;height:22px}.tile h3{font-size:14px;line-height:1.3;margin:0 0 4px;color:var(--navy)}.tile p{font-size:11px;line-height:1.4;margin:0;color:var(--muted)}.notice{display:flex;gap:12px;align-items:flex-start;padding:14px;background:white;border:1px solid var(--line);border-radius:15px;margin:9px 0}.notice .tileicon{width:38px;height:38px;margin:0;flex-shrink:0}.notice strong{display:block;color:var(--navy);font-size:13px}.notice p{margin:3px 0 0;color:var(--muted);font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}.page{padding:22px 21px}.back{border:0;background:#eaf0fa;color:var(--navy);border-radius:11px;padding:9px 12px;font-weight:700;font-size:12px;margin-bottom:19px}.page h1{font-size:27px;line-height:1.2;letter-spacing:-.7px;color:var(--navy);margin:0 0 7px}.page>p{font-size:13px;color:var(--muted);margin:0 0 19px}.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:white;border:1px solid var(--line);border-radius:14px;padding:13px;margin:9px 0;color:inherit;text-decoration:none}.item .tileicon{width:38px;height:38px;margin:0;flex-shrink:0}.item strong{display:block;color:var(--navy);font-size:13px}.item small{display:block;color:var(--muted);font-size:11px;margin-top:2px;overflow-wrap:anywhere}.empty,.state{padding:24px 17px;text-align:center;background:white;border:1px dashed #cbd7e6;border-radius:15px;color:var(--muted);font-size:13px}.state.error{color:#a83232;background:#fffafa;border-color:#f2caca}.form{display:grid;gap:13px;background:white;border:1px solid var(--line);border-radius:16px;padding:16px}.field{display:grid;gap:6px;color:var(--navy);font-size:12px;font-weight:700}.field input,.field textarea,.field select{width:100%;border:1px solid #dce4ef;border-radius:10px;background:#fff;padding:12px;color:var(--ink);outline:none;font-size:14px}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #3478f61a}.primary{border:0;border-radius:11px;background:var(--blue);color:white;padding:12px 15px;font-size:13px;font-weight:750}.primary:disabled{opacity:.55;cursor:wait}.helper{font-size:11px;color:var(--muted);margin:0}.bottom{position:fixed;z-index:10;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);padding:8px 20px calc(8px + env(safe-area-inset-bottom));background:#ffffffef;backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr}.navbtn{position:relative;border:0;background:transparent;color:#78869a;border-radius:12px;padding:7px 3px 5px;display:grid;justify-items:center;gap:3px;font-size:11px}.navbtn svg{width:20px;height:20px}.navbtn.active{color:var(--blue);font-weight:800}.navbtn.active:before{content:"";position:absolute;top:-8px;width:27px;height:3px;border-radius:4px;background:var(--blue)}.footer{text-align:center;padding:22px;color:#94a0b0;font-size:10px}.toast{position:fixed;z-index:20;left:50%;bottom:88px;transform:translate(-50%,12px);opacity:0;pointer-events:none;max-width:calc(100vw - 32px);background:var(--navy);color:white;padding:11px 15px;border-radius:12px;font-size:12px;transition:opacity .2s,transform .2s}.toast.show{opacity:1;transform:translate(-50%,0)}.loading{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:12px;padding:14px}.spinner{width:15px;height:15px;border:2px solid #dbe6f7;border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(min-width:520px){.hero h1{font-size:32px}.tile{min-height:150px;padding:18px}}@media(max-width:360px){.topbar{padding-left:15px;padding-right:15px}.hero,.section,.page{padding-left:15px;padding-right:15px}.searchwrap{padding-left:15px;padding-right:15px}.tile{padding:13px 11px;min-height:130px}.tileicon{width:38px;height:38px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

.resource-gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}.resource-photo{display:block;min-width:0;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:15px;text-decoration:none;color:var(--ink);box-shadow:0 3px 12px #142b4a05}.resource-photo img{display:block;width:100%;height:155px;object-fit:cover;background:#edf2f8}.resource-photo .photo-copy{padding:10px 11px 12px}.resource-photo strong{display:block;font-size:12px;line-height:1.35;color:var(--navy)}.resource-photo small{display:block;font-size:10px;line-height:1.4;color:var(--muted);margin-top:4px}.resource-section-title{font-size:14px;color:var(--navy);margin:23px 0 10px;font-weight:800}.resource-photo:focus-visible{outline:3px solid var(--blue);outline-offset:2px}@media(min-width:480px){.resource-photo img{height:180px}}

</style></head>
<body><main id="app" class="app"></main><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const $=s=>document.querySelector(s);const app=$('#app');let current='home',query='',announcements=[],resources=[],remoteState='idle';
const API_BASE=String(window.HITAJE_API_BASE||((location.protocol==='https:'||location.protocol==='http:')?location.origin:'')).replace(/\/$/,'');
const icons={home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>',book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21z"/><path d="M4 5.5v13A2.5 2.5 0 0 1 6.5 16H20"/></svg>',users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20v-1.5A5.5 5.5 0 0 1 8 13h2a5.5 5.5 0 0 1 5.5 5.5V20zM16 4.8a3.5 3.5 0 0 1 0 6.5M18 14a4.5 4.5 0 0 1 3.5 4.4V20h-3"/></svg>',info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/></svg>',mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>',bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>',search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg>',file:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>',arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>'};
const features=[{id:'learning',icon:'book',title:'Learning',desc:'Courses and study materials'},{id:'forum',icon:'users',title:'Forum / Registration',desc:'Connect and register your interest'},{id:'about',icon:'info',title:'About the Institute',desc:'Learn about HITAJE GROUPS'},{id:'contact',icon:'mail',title:'Contact',desc:'Send an enquiry to our team'}];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2800)}
async function api(path,options={}){if(!API_BASE)throw new Error('Backend is not configured for this build. Set HITAJE_API_BASE in api-config.js to your deployed HTTPS URL.');const res=await fetch(API_BASE+path,{...options,headers:{...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}});let data;try{data=await res.json()}catch{data=null}if(!res.ok)throw new Error(data?.error||`Request failed (${res.status})`);return data}
function header(){return `<header class="topbar"><div class="logo">H</div><div class="brand"><div class="brandname">HITAJE GROUPS</div><div class="brandtag">Learning · Resources · Community</div></div><button class="iconbtn" aria-label="Open announcements" data-go="announcements">${icons.bell}${announcements.length?'<span class="dot"></span>':''}</button></header>`}
function bottom(){return `<nav class="bottom" aria-label="Main navigation"><button class="navbtn ${current==='home'?'active':''}" data-nav="home">${icons.home}<span>Home</span></button><button class="navbtn ${current==='resources'||current==='learning'?'active':''}" data-nav="resources">${icons.book}<span>Resources</span></button></nav>`}
function shell(content){return `${header()}${content}${bottom()}<footer class="footer">HITAJE GROUPS · CBE</footer>`}
function itemCard(x,icon='file'){return `<article class="item"><div class="tileicon">${icons[icon]||icons.file}</div><div style="flex:1;min-width:0"><strong>${esc(x.title)}</strong><small>${esc(x.body||x.category||'')}</small></div>${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer" aria-label="Open ${esc(x.title)}" style="color:var(--blue);padding:6px">${icons.arrow}</a>`:''}</article>`}
function filteredResources(){return resources.filter(x=>(`${x.title} ${x.body} ${x.category}`).toLowerCase().includes(query.toLowerCase()))}
const localPictureResources=[
{title:'Training & Placement for Final-Year Students',body:'Training and placement overview',file:'training-placement-final-year.webp',category:'Placement'},
{title:'Summer Course & Placement',body:'Second-year summer course and placement information',file:'summer-course-placement.webp',category:'Courses'},
{title:'2015 Job Fair Companies',body:'Companies participating in the 2015 job fair',file:'job-fair-2015.webp',category:'Placement'},
{title:'2016 Job Fair Companies',body:'Companies participating in the 2016 job fair',file:'job-fair-2016.webp',category:'Placement'},
{title:'2017 Job Fair Companies',body:'Companies participating in the 2017 job fair',file:'job-fair-2017.webp',category:'Placement'},
{title:'2018 Manpower Supply Companies',body:'Placement and manpower company details',file:'manpower-companies-2018.webp',category:'Placement'},
{title:'2019 Manpower Supply Companies',body:'Placement and manpower company details',file:'manpower-companies-2019.webp',category:'Placement'},
{title:'New Requirements — Page 1',body:'Requirement details dated May 2024',file:'requirements-2024-page-1.webp',category:'Requirements'},
{title:'New Requirements — Page 2',body:'Requirement details dated May 2024',file:'requirements-2024-page-2.webp',category:'Requirements'},
{title:'New Requirements — Page 3',body:'Requirement details dated May 2024',file:'requirements-2024-page-3.webp',category:'Requirements'},
{title:'New Requirements — Page 4',body:'Requirement details dated May 2024',file:'requirements-2024-page-4.webp',category:'Requirements'},
{title:'15 Days Training Certificate',body:'Example training certificate',file:'15-days-training-certificate.webp',category:'Certificates'},
{title:'Industrial Visit Certificate',body:'Example industrial visit certificate',file:'industrial-visit-certificate-1.webp',category:'Certificates'},
{title:'On-the-Job Training Certificate',body:'Example OJT certificate',file:'ojt-certificate.webp',category:'Certificates'},
{title:'One-Day CNC Workshop',body:'CNC workshop information',file:'cnc-workshop.webp',category:'Workshops'},
{title:'One-Day IT Workshop',body:'IT workshop information',file:'it-workshop.webp',category:'Workshops'}
];
function filteredLocalPictures(){return localPictureResources.filter(x=>(`${x.title} ${x.body} ${x.category}`).toLowerCase().includes(query.toLowerCase()))}
function pictureCard(x){const src=`./resources/${x.file}`;return `<a class="resource-photo" href="${src}" target="_blank" rel="noopener noreferrer"><img src="${src}" alt="${esc(x.title)}" loading="lazy"><div class="photo-copy"><strong>${esc(x.title)}</strong><small>${esc(x.body)} · Tap to view full image</small></div></a>`}

function filteredAnnouncements(){return announcements.filter(x=>(`${x.title} ${x.body}`).toLowerCase().includes(query.toLowerCase()))}
function home(){
 const f=features.filter(x=>(`${x.title} ${x.desc}`).toLowerCase().includes(query.toLowerCase()));
 const ar=filteredAnnouncements().slice(0,2), rr=filteredResources().slice(0,2);
 const announcementHtml=remoteState==='loading'?'<div class="loading"><span class="spinner"></span>Loading updates…</div>':ar.length?ar.map(x=>`<article class="notice"><div class="tileicon">${icons.bell}</div><div><strong>${esc(x.title)}</strong><p>${esc(x.body)}</p></div></article>`).join(''):`<div class="empty">${remoteState==='error'?'Announcements could not load. Check your connection and retry.':remoteState==='offline'?'Connect the app to the deployed backend to load official announcements.':'No published announcements yet.'}</div>`;
 return shell(`<section class="hero"><div class="eyebrow">YOUR LEARNING HUB</div><h1>Learn. Grow. Achieve.</h1><p>Everything you need, organized in one simple place.</p></section><div class="searchwrap"><label class="search">${icons.search}<input id="search" type="search" placeholder="Search learning, resources, updates…" value="${esc(query)}" aria-label="Search content"></label></div><section class="section"><div class="sectionhead"><h2>Explore</h2><span class="muted">${f.length} sections</span></div><div class="grid">${f.map(x=>`<button class="tile" data-go="${x.id}"><div class="tileicon">${icons[x.icon]}</div><h3>${x.title}</h3><p>${x.desc}</p></button>`).join('')||'<div class="empty">No sections match your search.</div>'}</div></section><section class="section"><div class="sectionhead"><h2>Announcements</h2><button class="muted" style="border:0;background:none;color:var(--blue);font-weight:700" data-go="announcements">View all →</button></div>${announcementHtml}</section>${rr.length?`<section class="section"><div class="sectionhead"><h2>Recent resources</h2><button class="muted" style="border:0;background:none;color:var(--blue);font-weight:700" data-nav="resources">View all →</button></div>${rr.map(x=>itemCard(x)).join('')}</section>`:''}`);
}
function pageHead(title,desc){return `<section class="page"><button class="back" data-go="home">← &nbsp; Home</button><h1>${title}</h1><p>${desc}</p>`}
function contentPage(id){if(id==='announcements'){const rows=filteredAnnouncements();return shell(`${pageHead('Announcements','Official updates and notices from HITAJE GROUPS.')}${remoteState==='loading'?'<div class="loading"><span class="spinner"></span>Loading announcements…</div>':rows.length?rows.map(x=>`<article class="notice"><div class="tileicon">${icons.bell}</div><div><strong>${esc(x.title)}</strong><p>${esc(x.body)}</p><small class="muted">${esc((x.createdAt||'').slice(0,10))}</small></div></article>`).join(''):`<div class="empty">${remoteState==='error'?'Could not connect to announcements. Check the backend URL and internet connection.':'No published announcements yet.'}</div>`}</section>`)}
if(id==='resources'||id==='learning'){const rows=filteredResources(),pics=filteredLocalPictures();return shell(`${pageHead(id==='learning'?'Learning':'Resources',id==='learning'?'Explore learning materials, placement information and training documents.':'Browse the resource pictures supplied for HITAJE GROUPS.')}${remoteState==='loading'?'<div class="loading"><span class="spinner"></span>Loading online resources…</div>':''}${rows.length?`<div class="resource-section-title">Online resources</div>${rows.map(x=>itemCard(x)).join('')}`:remoteState==='error'?'<div class="state error">Online resources could not load. The bundled resource pictures below are still available.</div>':''}<div class="resource-section-title">Training, placement & institute documents <span class="muted">(${pics.length})</span></div>${pics.length?`<div class="resource-gallery">${pics.map(pictureCard).join('')}</div>`:'<div class="empty">No pictures match your search.</div>'}</section>`)}
if(id==='contact'){return shell(`${pageHead('Contact HITAJE GROUPS','Send a message to the team. Your enquiry is submitted to the configured backend.') }<form id="contactForm" class="form"><label class="field">Full name<input name="name" required maxlength="100" autocomplete="name" placeholder="Your name"></label><label class="field">Email address<input name="email" type="email" required maxlength="254" autocomplete="email" placeholder="you@example.com"></label><label class="field">Message<textarea name="message" required minlength="5" maxlength="3000" rows="5" placeholder="How can we help?"></textarea></label><button class="primary" type="submit">Send enquiry</button><p class="helper">Your message is sent securely over HTTPS when the backend is configured.</p></form></section>`)}
if(id==='forum'){return shell(`${pageHead('Forum / Registration','Tell us how to reach you. Registration submission is not enabled because the current backend has no verified registration endpoint.')}<form id="interestForm" class="form"><label class="field">Full name<input name="name" required maxlength="100" placeholder="Your name"></label><label class="field">Email address<input name="email" type="email" required maxlength="254" placeholder="you@example.com"></label><label class="field">Area of interest<select name="interest" required><option value="">Choose an option</option><option>Courses and learning</option><option>Institute information</option><option>Community / forum</option><option>Other</option></select></label><p class="helper">This form is a UI preview only. It will not send or store personal information until a real registration endpoint is added.</p><button class="primary" type="submit">Check registration setup</button></form></section>`)}
return shell(`${pageHead('About HITAJE GROUPS','An institute hub for learning, resources and community information.')}<article class="notice"><div class="tileicon">${icons.info}</div><div><strong>About the institute</strong><p>This screen is ready for verified institute details, contact information, course descriptions and official links. No unverified facts have been invented.</p></div></article><article class="notice"><div class="tileicon">${icons.book}</div><div><strong>Learning and resources</strong><p>Published materials are loaded from the configured HITAJE GROUPS API.</p></div></article></section>`)}
function render(){app.innerHTML=current==='home'?home():contentPage(current);app.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));app.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.nav)));const inp=$('#search');if(inp)inp.addEventListener('input',e=>{const pos=e.target.selectionStart;query=e.target.value;render();const next=$('#search');if(next){next.focus();next.setSelectionRange(pos,pos)}});const cf=$('#contactForm');if(cf)cf.addEventListener('submit',async e=>{e.preventDefault();const btn=cf.querySelector('button[type=submit]');btn.disabled=true;btn.textContent='Sending…';try{const body=Object.fromEntries(new FormData(cf).entries());const result=await api('/api/contact',{method:'POST',body:JSON.stringify(body)});cf.reset();toast(result.message||'Enquiry submitted.')}catch(err){toast(err.message)}finally{btn.disabled=false;btn.textContent='Send enquiry'}});const inf=$('#interestForm');if(inf)inf.addEventListener('submit',e=>{e.preventDefault();toast('Registration is not connected: the backend has no registration endpoint yet.')})}
function go(id){current=id;query='';render();window.scrollTo({top:0,behavior:'smooth'});if((id==='resources'||id==='learning'||id==='announcements')&&remoteState==='idle')loadRemote()}
async function loadRemote(){if(!API_BASE){remoteState='offline';return}remoteState='loading';if(current==='home'||current==='resources'||current==='learning'||current==='announcements')render();try{const [a,r]=await Promise.all([api('/api/announcements'),api('/api/resources')]);announcements=Array.isArray(a)?a:[];resources=Array.isArray(r)?r:[];remoteState='ready'}catch(err){remoteState='error';console.warn('HITAJE API request failed:',err.message)}if(current==='home'||current==='resources'||current==='learning'||current==='announcements')render()}
if(!API_BASE)remoteState='offline';render();if(API_BASE)loadRemote();
if('serviceWorker'in navigator&&(location.protocol==='https:'||location.protocol==='http:'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
